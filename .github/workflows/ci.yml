name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; nothing here may push, tag or touch secrets'
# scopes (audit A10). Actions are pinned to commit SHAs — a tag like @v4
# is mutable and a hijacked action would run with this token.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchprob
          POSTGRES_PASSWORD: pitchprob
          POSTGRES_DB: pitchprob
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pitchprob"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PITCHPROB_DATABASE_URL: postgresql+psycopg://pitchprob:pitchprob@localhost:5433/pitchprob
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy
      # full suite: the Postgres service container makes the integration
      # tests first-class in CI even when laptops skip them
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: docker build -f Dockerfile.api -t pitchprob-api .
      - run: docker build -t pitchprob-web frontend/
